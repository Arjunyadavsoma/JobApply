# Copy to config.yaml and edit. Everything here is read by `python -m jobagent ...`.
# The defaults below are tuned for an India-first fresher search (B.Tech 2027, AI/ML roles,
# Hyderabad + remote India). Change anything - these are YOUR settings, never hardcoded rules.

search:
  # Job titles / keywords to search for on LinkedIn, Naukri and Remotive.
  keywords:
  - AI Engineer
  - ML Engineer
  - Software Engineer
  - Python Developer
  - Data Analyst

  locations:
  - Hyderabad
  - Bengaluru
  - Remote
  # Only keep career-portal jobs whose title contains one of these words (case-insensitive).
  # Leave empty to keep every job from the listed companies.
  title_must_include:
  - engineer
  - developer
  - analyst
  - data
  - ai
  - ml
  # Drop jobs whose title contains any of these. NOTE: "intern" is NOT excluded by default -
  # internships are target roles for freshers. Senior titles are excluded instead.
  title_exclude:
  - principal
  - staff
  - director
  - head of
  - architect
  # Drop career-portal jobs whose location doesn't mention one of these (empty = keep all).
  location_include:
  - india
  - hyderabad
  - bengaluru
  - bangalore
  - pune
  - chennai
  - mumbai
  - gurugram
  - gurgaon
  - noida
  - remote
  # Scoring order: jobs whose location/source matches earlier entries are scored first.
  priority_locations: [hyderabad, india, naukri, remote]
  max_age_days: 14          # LinkedIn "posted within" filter
  min_match_score: 60       # jobs scoring below this are marked "skipped"
  # Keep jobs located in India + remote jobs open to India ("any" keeps everything).
  location_mode: india_remote
  # Seed the default India MNC career registry (TCS-style drives, Microsoft/Google/Oracle India,
  # product companies) when you haven't configured your own company list. Set false to disable.
  use_india_registry: true
  # Automatic discover+score run every N hours in the dashboard (0 = off).
  autodiscover_hours: 0

sources:
  linkedin:
    enabled: true
    pages: 3                # ~10 jobs per page, per keyword x location
  naukri:
    enabled: true
    pages: 1                # 20 jobs per page; opens a visible Chrome window
  instahyre:
    enabled: true
    pages: 3                # 20 jobs per page
    # Instahyre searches by skills rather than job titles.
    skills: [Python, Machine Learning]
    # Job functions: 10 = Backend Development, 1 = Full-Stack Development, 76 = Other Software Development
    job_functions: [10, 1, 76]
    years:                  # your years of experience; blank = use applicant.total_experience_years
  remotive:                 # remote-only jobs (legitimate public API, no key)
    enabled: true
    pages: 1
  arbeitnow:                # EU + international remote jobs (public API, no key)
    enabled: false
    pages: 1
  himalayas:                # remote-first board, cursor-paginated firehose (public API)
    enabled: true
    pages: 1                # = 5 API pages x 20 jobs scanned, keyword+India filtered
  jobicy:                   # remote dev jobs, tag search (public API)
    enabled: true
    pages: 1
  # Company career portals. Use the board slug from the careers URL:
  #   Greenhouse: https://job-boards.greenhouse.io/<slug>   or boards.greenhouse.io/<slug>
  #   Lever:      https://jobs.lever.co/<slug>
  #   Ashby:      https://jobs.ashbyhq.com/<slug>
  workday_pages: 2 # Workday: result pages (20 jobs each) per company per keyword
  portal_pages: 2  # Career portals: result pages per keyword
  companies:
    # Career portals: paste ANY company's careers URL ('Name | URL'). The agent detects the site:
    # Amazon, Google, Apple, Eightfold (Microsoft, Qualcomm...), Oracle (JPMorgan...), MyNextHire (Swiggy...),
    # SuccessFactors, or an embedded Greenhouse/Lever/Workday/... board. Other sites are searched in a
    # hidden browser with the AI picking the job links (slower; one AI call per company per search).
    # Leave this list EMPTY to auto-seed the India registry (25+ MNC + product company career pages).
    portals:
    - Amazon | https://www.amazon.jobs/en/
    - Google | https://www.google.com/about/careers/applications/jobs/results
    - Microsoft | https://apply.careers.microsoft.com/careers
    greenhouse: [stripe, databricks]
    lever: [palantir]
    ashby: [ramp]
    # Workday: careers URL (optionally 'Name | URL'). SmartRecruiters: company id from
    # jobs.smartrecruiters.com/<Id>. Workable: slug from apply.workable.com/<slug>.
    # Workday and SmartRecruiters are searched with your keywords.
    workday:
    - NVIDIA | https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
    - Mastercard | https://mastercard.wd1.myworkdayjobs.com/CorporateCareers
    smartrecruiters:
    - ServiceNow
    - Freshworks
    workable:
    - apna

llm:
  # groq         = GROQ_API_KEY from .env - RECOMMENDED (free tier available, fast open models)
  # api          = ANTHROPIC_API_KEY from .env (pay-as-you-go API credits)
  # subscription = use your Claude Pro/Max login via the Claude Code CLI
  backend: groq
  # Groq backend settings (llm.backend: groq):
  model: openai/gpt-oss-120b      # or openai/gpt-oss-20b, qwen/qwen3-8b, ...
  fallback_model: openai/gpt-oss-20b   # used when the primary model errors or returns junk
  # groq_base_url: https://api.groq.com/openai/v1   # override for another OpenAI-compatible provider
  reasoning_effort: medium        # low | medium | high (gpt-oss models)
  max_requests_per_day: 0         # 0 = unlimited; set a cap to protect your quota
  # claude_cli: "C:/path/to/claude.exe"   # subscription backend only; auto-detected
  # Effort per task (Claude levels; on Groq gpt-oss these map to reasoning_effort low/medium/high)
  score_effort: low
  tailor_effort: high
  form_effort: medium

# Phase 17: application quality gates + the three execution modes.
# MODE A (discovery) and MODE B (assisted - agent fills, YOU submit) are always available.
# MODE C (authorized submission) needs BOTH automation.authorized_submission: true below
# AND per-job approval in the Queue page. It still stops on CAPTCHAs, login walls,
# legal declarations and sensitive questions - by design, never bypassed.
automation:
  authorized_submission: false   # keep false unless you really want auto-submit
  max_per_day: 15                # application budget per day
  max_per_company: 2             # don't spam one employer
  min_match_score: 70            # only apply to real matches
  min_eligibility: likely_eligible   # eligible | likely_eligible | needs_verification
  min_quality_score: 40          # job verification quality floor (0-100)
  min_salary_lpa: 6              # CTC floor from your profile
  preferred_locations: [Hyderabad, Bengaluru, Chennai, Pune, Mumbai, Gurugram, Noida, Remote]

# Phase 17: optional email monitoring (READ-ONLY; nothing is ever auto-sent).
# Gmail: run scripts in README (OAuth, gmail.readonly scope) - token lands in data/gmail_token.json.
# IMAP: set imap_host/imap_user + EMAIL_IMAP_PASSWORD env var (works with Gmail app passwords).
email:
  transport: ''                  # '' (off) | gmail | imap
  imap_host: ''                  # e.g. imap.gmail.com
  imap_user: ''                  # your address

browser:
  channel: chrome           # chrome or msedge (Edge is built into Windows)
  profile_dir: .browser_profile   # persistent profile, so you stay logged in to LinkedIn/Naukri

# Facts used to answer application-form questions that aren't in your resume.
# Prefer editing the Candidate Profile in the dashboard (it stores richer India-first data);
# these values are merged into the profile on first run.
applicant:
  phone: +91 90000 00000
  linkedin_url: https://www.linkedin.com/in/your-handle
  github_url: https://github.com/your-handle
  portfolio_url: ''
  current_location: Hyderabad, India
  willing_to_relocate: Yes
  work_authorization: Indian citizen; authorized to work in India
  notice_period: ''
  current_ctc: ''
  expected_ctc: ''
  years_of_experience: ''
  gender: ''                # leave blank to skip voluntary EEO questions
  how_did_you_hear: Company careers page
