name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: no repo write access needed; contents read is implicit for checkout.
permissions:
  contents: read

jobs:
  backend:
    name: Python tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-httpserver ruff
      - name: Ruff lint (syntax + errors only)
        run: ruff check jobagent --select E9,F63,F7,F82,F401 --no-cache
      - name: Run offline test suite (no network, no browsers, no API keys)
        env:
          GROQ_API_KEY: gsk_ci_dummy
        run: python -m pytest tests/ -q -m "not e2e and not live" --ignore=tests/e2e

  frontend:
    name: TypeScript + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type check
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
      - name: Production build
        working-directory: web
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history for secrets
      - name: Secret scan (pushed history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency vulnerability audit (Python, advisory)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true
        # pip-audit findings are advisory in CI for now — reported, not blocking;
        # raise to blocking once the advisories are triaged and pinned.

  e2e:
    name: Sandbox E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-httpserver
          playwright install chromium --with-deps
      - name: Run sandbox E2E suite (local fixtures only)
        env:
          GROQ_API_KEY: gsk_ci_dummy
        run: python -m pytest tests/e2e -q -m e2e --ignore=tests/e2e/test_live_adapters.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image (browser included)
        run: docker build -t jobapply:ci .
      - name: Build image (lean, no browser)
        run: docker build --build-arg INSTALL_BROWSER=false -t jobapply:ci-lean .
      - name: Smoke test: container starts and reports liveness
        run: |
          docker run -d --name jobapply-smoke -p 8600:8600 jobapply:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8600/health/live > /dev/null 2>&1; then
              echo "liveness OK"; docker rm -f jobapply-smoke; exit 0
            fi
            sleep 2
          done
          echo "container did not become live in 60s"; docker logs jobapply-smoke; docker rm -f jobapply-smoke; exit 1
